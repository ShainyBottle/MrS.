<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }
        h1, h2, h3 {
            color: #fff;
            margin-bottom: 15px;
            border: none;
            outline: none;
            text-shadow: none;
        }
        input {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input::placeholder {
            color: #888;
        }
        button {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .error {
            color: #ff4444;
            margin-bottom: 15px;
        }
        .info-block {
            border: 1px solid #fff;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .toggle-list {
            border: 1px solid #fff;
            margin-bottom: 15px;
        }
        .toggle-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-header:hover {
            background: #111;
        }
        .toggle-content {
            display: none;
            padding: 0 16px 16px 16px;
        }
        .toggle-content.open {
            display: block;
        }
        .search-inside {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .list-item {
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .back-link {
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 8px 16px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover {
            background: #fff;
            color: #000;
        }
        .arrow {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">

        <div id="loginPage" class="page active">
            <h1>Login</h1>
            <div id="loginError" class="error"></div>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <p style="text-align:center;">No account? <a href="#" onclick="showPage('registerPage')" style="color:#fff;">Register</a></p>
        </div>

        <div id="registerPage" class="page">
            <h1>Register</h1>
            <div id="registerError" class="error"></div>
            <input type="text" id="regUsername" placeholder="Username">
            <input type="password" id="regPassword" placeholder="Password">
            <button onclick="register()">Register</button>
            <p style="text-align:center;">Have account? <a href="#" onclick="showPage('loginPage')" style="color:#fff;">Login</a></p>
        </div>

        <div id="mainPage" class="page">
            <h1>Search Player</h1>
            <button onclick="logout()" style="width:auto;margin-bottom:30px;">Logout</button>
            <input type="text" id="searchInput" placeholder="Input Name">
            <button onclick="searchPlayer()">Search</button>
            <div id="searchError" class="error"></div>
        </div>

        <div id="playerPage" class="page">
            <a href="#" class="back-link" onclick="goToMain()">← Back</a>
            <div class="info-block">
                <div class="info-row"><span>Username / Display Name</span><span id="pName">-</span></div>
                <div class="info-row"><span>Account Created</span><span id="pCreated">-</span></div>
                <div class="info-row"><span>Days Old</span><span id="pDays">-</span></div>
            </div>

            <div class="toggle-list" id="friendsBlock">
                <div class="toggle-header" onclick="toggleList('friendsList')">
                    <span>Friends: <span id="friendsCount">0</span></span>
                    <span class="arrow">▼</span>
                </div>
                <div class="toggle-content" id="friendsList">
                    <input type="text" class="search-inside" placeholder="Search friends..." oninput="filterList('friendsInner', this.value)">
                    <div id="friendsInner"></div>
                </div>
            </div>

            <div class="toggle-list" id="communitiesBlock">
                <div class="toggle-header" onclick="toggleList('communitiesList')">
                    <span>Communities: <span id="communitiesCount">0</span></span>
                    <span class="arrow">▼</span>
                </div>
                <div class="toggle-content" id="communitiesList">
                    <input type="text" class="search-inside" placeholder="Search communities..." oninput="filterList('communitiesInner', this.value)">
                    <div id="communitiesInner"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('users') || '{}');
        let currentUser = localStorage.getItem('currentUser') || '';
        let playerData = null;

        const mockDatabase = {
            'player1': {
                name: 'player1',
                created: '2020-03-15',
                friends: ['AlphaWolf', 'BetaDragon', 'CoolCat', 'DarkKnight', 'EagleEye', 'FrostByte', 'GhostRider', 'HyperNova'],
                communities: ['GamingLegends', 'SpeedRunners', 'ModMakers', 'PixelArtists', 'CodeWarriors', 'NightOwls']
            },
            'player2': {
                name: 'player2',
                created: '2019-07-22',
                friends: ['ShadowBlade', 'StarLord', 'ThunderGod', 'IceQueen', 'FireMage', 'WindWalker'],
                communities: ['RPGWorld', 'AnimeFans', 'TechGeeks']
            },
            'test': {
                name: 'test',
                created: '2023-01-10',
                friends: ['FriendOne', 'FriendTwo', 'FriendThree', 'BestBuddy'],
                communities: ['TestCommunity', 'BeginnersHub']
            }
        };

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'mainPage' && !currentUser) {
                showPage('loginPage');
            }
        }

        function saveUsers() {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const err = document.getElementById('registerError');
            err.textContent = '';
            if (!username || !password) { err.textContent = 'Fill all fields'; return; }
            if (users[username]) { err.textContent = 'Username exists'; return; }
            users[username] = { password: password };
            saveUsers();
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            alert('Registered! Please login.');
            showPage('loginPage');
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const err = document.getElementById('loginError');
            err.textContent = '';
            if (!username || !password) { err.textContent = 'Fill all fields'; return; }
            if (!users[username] || users[username].password !== password) {
                err.textContent = 'Wrong credentials';
                return;
            }
            currentUser = username;
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showPage('mainPage');
        }

        function logout() {
            currentUser = '';
            localStorage.removeItem('currentUser');
            showPage('loginPage');
        }

        function searchPlayer() {
            const query = document.getElementById('searchInput').value.trim();
            const err = document.getElementById('searchError');
            err.textContent = '';
            if (!query) { err.textContent = 'Enter a name'; return; }
            const data = mockDatabase[query.toLowerCase()];
            if (!data) { err.textContent = 'Player not found'; return; }
            playerData = data;
            document.getElementById('pName').textContent = data.name;
            document.getElementById('pCreated').textContent = data.created;
            const createdDate = new Date(data.created);
            const days = Math.floor((Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24));
            document.getElementById('pDays').textContent = days;
            document.getElementById('friendsCount').textContent = data.friends.length;
            document.getElementById('communitiesCount').textContent = data.communities.length;
            renderList('friendsInner', data.friends);
            renderList('communitiesInner', data.communities);
            document.getElementById('friendsList').classList.remove('open');
            document.getElementById('communitiesList').classList.remove('open');
            showPage('playerPage');
        }

        function renderList(containerId, items) {
            const container = document.getElementById(containerId);
            container.innerHTML = items.map(item => `<div class="list-item">${item}</div>`).join('');
        }

        function toggleList(listId) {
            document.getElementById(listId).classList.toggle('open');
        }

        function filterList(containerId, query) {
            const container = document.getElementById(containerId);
            const items = container.querySelectorAll('.list-item');
            const q = query.toLowerCase();
            items.forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        function goToMain() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchError').textContent = '';
            showPage('mainPage');
        }

        if (currentUser) {
            showPage('mainPage');
        } else {
            showPage('loginPage');
        }
    </script>
</body>
</html>
