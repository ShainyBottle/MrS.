<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Player Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }
        h1, h2, h3 {
            color: #fff;
            margin-bottom: 15px;
            border: none;
            outline: none;
        }
        input {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 16px;
            width: 100%;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        input::placeholder {
            color: #888;
        }
        button {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            background: #fff;
            color: #000;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .error {
            color: #ff4444;
            margin-bottom: 15px;
        }
        .info-block {
            border: 1px solid #fff;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .toggle-list {
            border: 1px solid #fff;
            margin-bottom: 15px;
        }
        .toggle-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-header:hover {
            background: #111;
        }
        .toggle-content {
            display: none;
            padding: 0 16px 16px 16px;
        }
        .toggle-content.open {
            display: block;
        }
        .search-inside {
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .list-item {
            padding: 8px 0;
            border-bottom: 1px solid #222;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .back-link {
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 8px 16px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover {
            background: #fff;
            color: #000;
        }
        .arrow {
            font-size: 20px;
        }
        a {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">

        <div id="loginPage" class="page active">
            <h1>Login</h1>
            <div id="loginError" class="error"></div>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <p style="text-align:center;">No account? <a href="#" onclick="showPage('registerPage')">Register</a></p>
        </div>

        <div id="registerPage" class="page">
            <h1>Register</h1>
            <div id="registerError" class="error"></div>
            <input type="text" id="regUsername" placeholder="Username">
            <input type="password" id="regPassword" placeholder="Password">
            <button onclick="register()">Register</button>
            <p style="text-align:center;">Have account? <a href="#" onclick="showPage('loginPage')">Login</a></p>
        </div>

        <div id="mainPage" class="page">
            <h1>Search Roblox Player</h1>
            <button onclick="logout()" style="width:auto;margin-bottom:30px;">Logout</button>
            <input type="text" id="searchInput" placeholder="Input Name">
            <button onclick="searchPlayer()">Search</button>
            <div id="searchError" class="error"></div>
        </div>

        <div id="playerPage" class="page">
            <a href="#" class="back-link" onclick="goToMain()">← Back</a>
            <div class="info-block">
                <div class="info-row"><span>Username / Display Name</span><span id="pName">-</span></div>
                <div class="info-row"><span>Account Created</span><span id="pCreated">-</span></div>
                <div class="info-row"><span>Days Old</span><span id="pDays">-</span></div>
            </div>

            <div class="toggle-list" id="friendsBlock">
                <div class="toggle-header" onclick="toggleList('friendsList')">
                    <span>Friends: <span id="friendsCount">0</span></span>
                    <span class="arrow">▼</span>
                </div>
                <div class="toggle-content" id="friendsList">
                    <input type="text" class="search-inside" placeholder="Search friends..." oninput="filterList('friendsInner', this.value)">
                    <div id="friendsInner"></div>
                </div>
            </div>

            <div class="toggle-list" id="communitiesBlock">
                <div class="toggle-header" onclick="toggleList('communitiesList')">
                    <span>Groups: <span id="communitiesCount">0</span></span>
                    <span class="arrow">▼</span>
                </div>
                <div class="toggle-content" id="communitiesList">
                    <input type="text" class="search-inside" placeholder="Search groups..." oninput="filterList('communitiesInner', this.value)">
                    <div id="communitiesInner"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('users') || '{}');
        let currentUser = localStorage.getItem('currentUser') || '';

        async function robloxApi(url, options = {}) {
            const proxyUrl = 'https://workers-robtex-proxy.khulnasoft.workers.dev/';
            try {
                const res = await fetch(proxyUrl + url, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'Content-Type': 'application/json',
                    }
                });
                if (!res.ok) throw new Error('API error');
                return await res.json();
            } catch (e) {
                const backupProxy = 'https://api.codetabs.com/v1/proxy?quest=';
                const res = await fetch(backupProxy + url, {
                    ...options,
                    headers: {
                        ...options.headers,
                        'Content-Type': 'application/json',
                    }
                });
                if (!res.ok) throw new Error('API error');
                return await res.json();
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'mainPage' && !currentUser) {
                showPage('loginPage');
            }
        }

        function saveUsers() {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const err = document.getElementById('registerError');
            err.textContent = '';
            if (!username || !password) { err.textContent = 'Fill all fields'; return; }
            if (users[username]) { err.textContent = 'Username exists'; return; }
            users[username] = { password: password };
            saveUsers();
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            alert('Registered! Please login.');
            showPage('loginPage');
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const err = document.getElementById('loginError');
            err.textContent = '';
            if (!username || !password) { err.textContent = 'Fill all fields'; return; }
            if (!users[username] || users[username].password !== password) {
                err.textContent = 'Wrong credentials';
                return;
            }
            currentUser = username;
            localStorage.setItem('currentUser', currentUser);
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showPage('mainPage');
        }

        function logout() {
            currentUser = '';
            localStorage.removeItem('currentUser');
            showPage('loginPage');
        }

        async function searchPlayer() {
            const query = document.getElementById('searchInput').value.trim();
            const err = document.getElementById('searchError');
            err.textContent = '';
            if (!query) { err.textContent = 'Enter a name'; return; }

            try {
                const userId = await getUserIdByUsername(query);
                if (!userId) { err.textContent = 'Player not found'; return; }

                const [userDetails, friendsData, groupsData] = await Promise.all([
                    robloxApi(`https://users.roblox.com/v1/users/${userId}`),
                    robloxApi(`https://friends.roblox.com/v1/users/${userId}/friends`),
                    robloxApi(`https://groups.roblox.com/v2/users/${userId}/groups/roles`)
                ]);

                const createdDate = new Date(userDetails.created);
                const days = Math.floor((Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24));

                document.getElementById('pName').textContent = userDetails.name || query;
                document.getElementById('pCreated').textContent = createdDate.toISOString().split('T')[0];
                document.getElementById('pDays').textContent = days;
                document.getElementById('friendsCount').textContent = friendsData.data ? friendsData.data.length : 0;
                document.getElementById('communitiesCount').textContent = groupsData.data ? groupsData.data.length : 0;

                const friendNames = friendsData.data ? friendsData.data.map(f => f.name || f.displayName) : [];
                const groupNames = groupsData.data ? groupsData.data.map(g => g.group.name) : [];

                renderList('friendsInner', friendNames);
                renderList('communitiesInner', groupNames);

                document.getElementById('friendsList').classList.remove('open');
                document.getElementById('communitiesList').classList.remove('open');

                showPage('playerPage');
            } catch (e) {
                err.textContent = 'Error fetching data. Please try again later.';
                console.error(e);
            }
        }

        async function getUserIdByUsername(username) {
            try {
                const data = await robloxApi(
                    `https://users.roblox.com/v1/usernames/users`,
                    {
                        method: 'POST',
                        body: JSON.stringify({ usernames: [username], excludeBannedUsers: true })
                    }
                );
                return data.data && data.data.length > 0 ? data.data[0].id : null;
            } catch (e) {
                return null;
            }
        }

        function renderList(containerId, items) {
            const container = document.getElementById(containerId);
            if (items.length === 0) {
                container.innerHTML = '<div class="list-item">None</div>';
                return;
            }
            container.innerHTML = items.map(item => `<div class="list-item">${item}</div>`).join('');
        }

        function toggleList(listId) {
            document.getElementById(listId).classList.toggle('open');
        }

        function filterList(containerId, query) {
            const container = document.getElementById(containerId);
            const items = container.querySelectorAll('.list-item');
            const q = query.toLowerCase();
            items.forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(q) ? 'block' : 'none';
            });
        }

        function goToMain() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchError').textContent = '';
            showPage('mainPage');
        }

        if (currentUser) {
            showPage('mainPage');
        } else {
            showPage('loginPage');
        }
    </script>
</body>
</html>
